spring.config.import=optional:file:.env[.properties]
spring.application.name=index
# ===================================================================
# NeonDB PostgreSQL DataSource Configuration
# ===================================================================
# Note: Always include ?sslmode=require for NeonDB connections
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HikariCP Connection Pool Settings (Optimized for Neon Serverless)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# Hibernate / JPA Settings
# ===================================================================
# 'update' automatically creates/updates tables based on your @Entity models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

server.port=${SERVER_PORT:8002}